<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1700" viewBox="0 0 2400 1700">
  <defs>
    <style>
      .t{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;fill:#17223b}
      .title{font-size:58px;font-weight:800}.sub{font-size:26px;fill:#697386}
      .lane{font-size:31px;font-weight:800}.nodeTitle{font-size:28px;font-weight:800}.nodeText{font-size:22px;fill:#4f5c70}
      .label{font-size:21px;font-weight:700}.stateTitle{font-size:25px;font-weight:800}.stateText{font-size:20px;fill:#4f5c70}
      .box{fill:#fff;stroke:#7d2ae8;stroke-width:4}.blue{fill:#eff6ff;stroke:#2f6fed;stroke-width:4}
      .green{fill:#eefaf4;stroke:#15875b;stroke-width:4}.amber{fill:#fff7dc;stroke:#b77900;stroke-width:4}
      .red{fill:#fff0ee;stroke:#ca4937;stroke-width:4}.gray{fill:#f4f4f7;stroke:#737784;stroke-width:4}
      .arrow{stroke:#7d2ae8;stroke-width:6;fill:none;marker-end:url(#m)}.knowledgeArrow{stroke:#15875b;stroke-width:6;fill:none;marker-end:url(#mg)}
      .loop{stroke:#ca4937;stroke-width:5;fill:none;stroke-dasharray:12 10;marker-end:url(#mr)}
    </style>
    <marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#7d2ae8"/></marker>
    <marker id="mg" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#15875b"/></marker>
    <marker id="mr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#ca4937"/></marker>
  </defs>

  <rect width="2400" height="1700" fill="#ffffff"/>
  <text x="78" y="88" class="t title">Canva AI 海报合规：生成约束 + 最终审核</text>
  <text x="80" y="132" class="t sub">用户点击“生成”后连续自动执行；未经最终审核的候选海报不展示，也不能下载或发布。</text>

  <rect x="60" y="175" width="2280" height="270" rx="28" fill="#fbf8ff" stroke="#ddd3e8" stroke-width="3"/>
  <rect x="60" y="465" width="2280" height="330" rx="28" fill="#f8f4ff" stroke="#ddd3e8" stroke-width="3"/>
  <rect x="60" y="815" width="2280" height="470" rx="28" fill="#eef5ff" stroke="#ced9e9" stroke-width="3"/>
  <rect x="60" y="1305" width="2280" height="240" rx="28" fill="#f1f8f4" stroke="#cfdfd5" stroke-width="3"/>

  <rect x="60" y="175" width="270" height="270" rx="28" fill="#fff" stroke="#ddd3e8" stroke-width="3"/>
  <rect x="60" y="465" width="270" height="330" rx="28" fill="#fff" stroke="#ddd3e8" stroke-width="3"/>
  <rect x="60" y="815" width="270" height="470" rx="28" fill="#fff" stroke="#ced9e9" stroke-width="3"/>
  <rect x="60" y="1305" width="270" height="240" rx="28" fill="#fff" stroke="#cfdfd5" stroke-width="3"/>
  <text x="195" y="320" text-anchor="middle" class="t lane" fill="#5f22c8">用户</text>
  <text x="195" y="645" text-anchor="middle" class="t lane" fill="#5f22c8">Canva AI</text>
  <text x="195" y="1025" text-anchor="middle" class="t lane" fill="#2f6fed">Compliance</text>
  <text x="195" y="1063" text-anchor="middle" class="t lane" fill="#2f6fed">Layer</text>
  <text x="195" y="1400" text-anchor="middle" class="t lane" fill="#15875b">知识与规则</text>
  <text x="195" y="1438" text-anchor="middle" class="t lane" fill="#15875b">服务</text>

  <rect x="390" y="235" width="300" height="150" rx="22" class="box"/>
  <text x="540" y="292" text-anchor="middle" class="t nodeTitle">输入营销意图</text>
  <text x="540" y="332" text-anchor="middle" class="t nodeText">选择产品 Context</text>
  <text x="540" y="365" text-anchor="middle" class="t nodeText">点击“生成”</text>

  <rect x="895" y="235" width="330" height="150" rx="22" class="box"/>
  <text x="1060" y="293" text-anchor="middle" class="t nodeTitle">等待生成与检查</text>
  <text x="1060" y="337" text-anchor="middle" class="t nodeText">仅显示进度，不展示候选海报</text>

  <rect x="1900" y="235" width="350" height="150" rx="22" class="box"/>
  <text x="2075" y="292" text-anchor="middle" class="t nodeTitle">查看最终海报</text>
  <text x="2075" y="334" text-anchor="middle" class="t nodeText">继续编辑、下载或发布</text>
  <text x="2075" y="368" text-anchor="middle" class="t nodeText">仅对有效结果开放推进操作</text>

  <rect x="390" y="525" width="330" height="190" rx="22" class="box"/>
  <text x="555" y="580" text-anchor="middle" class="t nodeTitle">应用生成约束</text>
  <text x="555" y="622" text-anchor="middle" class="t nodeText">结合意图、Context 与知识包</text>
  <text x="555" y="659" text-anchor="middle" class="t nodeText">生成可用候选内容</text>
  <text x="555" y="693" text-anchor="middle" class="t nodeText">候选版本仅在后台存在</text>

  <rect x="830" y="525" width="330" height="190" rx="22" class="box"/>
  <text x="995" y="582" text-anchor="middle" class="t nodeTitle">生成并渲染海报</text>
  <text x="995" y="625" text-anchor="middle" class="t nodeText">背景图 + 可编辑文字图层</text>
  <text x="995" y="663" text-anchor="middle" class="t nodeText">形成最终像素画面</text>

  <rect x="1570" y="525" width="390" height="190" rx="22" class="box"/>
  <text x="1765" y="580" text-anchor="middle" class="t nodeTitle">自动优化并重渲染</text>
  <text x="1765" y="622" text-anchor="middle" class="t nodeText">不改变核心营销意图时默认处理</text>
  <text x="1765" y="660" text-anchor="middle" class="t nodeText">修改后重新执行完整审核</text>
  <text x="1765" y="697" text-anchor="middle" class="t nodeText">修复动作本身不等于通过</text>

  <rect x="390" y="885" width="330" height="180" rx="22" class="blue"/>
  <text x="555" y="942" text-anchor="middle" class="t nodeTitle">最终海报文字提取</text>
  <text x="555" y="985" text-anchor="middle" class="t nodeText">文字图层优先 · OCR 兜底</text>
  <text x="555" y="1023" text-anchor="middle" class="t nodeText">记录区域、置信度与文本哈希</text>

  <rect x="830" y="885" width="420" height="180" rx="22" class="blue"/>
  <text x="1040" y="937" text-anchor="middle" class="t nodeTitle">独立最终审核</text>
  <text x="1040" y="980" text-anchor="middle" class="t nodeText">强制声明完整性 · 规则与语义</text>
  <text x="1040" y="1018" text-anchor="middle" class="t nodeText">字号、对比度、遮挡与裁切可读性</text>

  <rect x="1370" y="885" width="330" height="180" rx="22" class="blue"/>
  <text x="1535" y="942" text-anchor="middle" class="t nodeTitle">判断处理路径</text>
  <text x="1535" y="985" text-anchor="middle" class="t nodeText">可自动优化？信息是否充分？</text>
  <text x="1535" y="1023" text-anchor="middle" class="t nodeText">是否仍存在明确问题？</text>

  <rect x="1820" y="855" width="440" height="255" rx="22" fill="#fff" stroke="#7d2ae8" stroke-width="4"/>
  <text x="2040" y="905" text-anchor="middle" class="t nodeTitle">只返回经审核的结果</text>
  <rect x="1850" y="935" width="180" height="68" rx="14" class="green"/><text x="1940" y="977" text-anchor="middle" class="t stateTitle">可以发布</text>
  <rect x="2050" y="935" width="180" height="68" rx="14" class="amber"/><text x="2140" y="977" text-anchor="middle" class="t stateTitle">需要补充</text>
  <rect x="1850" y="1020" width="180" height="68" rx="14" class="red"/><text x="1940" y="1062" text-anchor="middle" class="t stateTitle">发布前修改</text>
  <rect x="2050" y="1020" width="180" height="68" rx="14" class="gray"/><text x="2140" y="1062" text-anchor="middle" class="t stateTitle">不在范围</text>

  <rect x="500" y="1352" width="490" height="145" rx="22" class="green"/>
  <text x="745" y="1405" text-anchor="middle" class="t nodeTitle">校验 Context 与路由知识包</text>
  <text x="745" y="1447" text-anchor="middle" class="t nodeText">返回生成约束、强制义务与覆盖版本</text>

  <rect x="1260" y="1352" width="580" height="145" rx="22" class="green"/>
  <text x="1550" y="1405" text-anchor="middle" class="t nodeTitle">同一知识包约束生成并支持最终审核</text>
  <text x="1550" y="1447" text-anchor="middle" class="t nodeText">知识包缺失时不得由模型自行生成规则</text>

  <path d="M690 310 H850" class="arrow"/>
  <path d="M540 385 V485" class="arrow"/><text x="562" y="448" class="t label" fill="#7d2ae8">自动连续执行</text>
  <path d="M720 620 H790" class="arrow"/>
  <path d="M995 715 V835 H555 V855" class="arrow"/><text x="740" y="814" class="t label" fill="#7d2ae8">渲染完成即审</text>
  <path d="M720 975 H790" class="arrow"/>
  <path d="M1250 975 H1330" class="arrow"/>
  <path d="M1700 975 H1780" class="arrow"/>
  <path d="M2040 1110 V1160 H2075 V205" class="arrow"/>

  <path d="M540 525 V1497 H460" class="knowledgeArrow" opacity="0"/>
  <path d="M540 525 V1280 H745 V1315" class="knowledgeArrow"/>
  <path d="M990 1425 H1220" class="knowledgeArrow"/>
  <path d="M1550 1352 V1098 H1040 V1080" class="knowledgeArrow"/>
  <path d="M1260 1425 H1180 V620 H1160" class="knowledgeArrow"/>
  <text x="1190" y="1390" class="t label" fill="#15875b">同一版本化知识包</text>

  <path d="M1535 885 V770 H1765 V745" class="loop"/>
  <path d="M1570 620 H1210 V800 H555 V855" class="loop"/>
  <text x="1420" y="754" class="t label" fill="#ca4937">可在不改变意图时自动优化</text>

  <rect x="340" y="1575" width="2000" height="78" rx="18" fill="#f8f4ff" stroke="#d8cae8" stroke-width="3"/>
  <text x="1340" y="1626" text-anchor="middle" class="t label" fill="#5f22c8">失效规则：海报文字、Context、知识包版本任一变化 → 旧结果失效 → 重新约束、渲染并完成最终审核。</text>
</svg>
